[package]
name = "clipvault"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
eframe = "0.37.0"
global-hotkey = "0.9.0"
image = { version = "0.25", default-features = false, features = ["png"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-vision = { version = "0.3.2", default-features = false, features = ["std", "VNRequest", "VNRequestHandler", "VNRecognizeTextRequest", "VNObservation", "VNTypes"] }
resvg = { version = "0.48.1", default-features = false }
tray-icon = "0.26.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
